<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THEME</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        /* Main heading */

        h1 {
            color: #1b5e20;
            background-color: #81c784;
            padding: 20px;
            border-radius: 15px;
        }

        /* Section headings */

        h2 {
            color: #2e7d32;
            margin-top: 25px;
        }

        /* Theme boxes */

        .theme-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        /* Individual buttons */

        .theme-button {
            background-color: white;
            color: #2e7d32;
            border: 3px solid #81c784;
            border-radius: 15px;
            padding: 18px 30px;
            font-size: 17px;
            cursor: pointer;
        }

        .theme-button:hover {
            background-color: #c8e6c9;
        }

        /* Different colour boxes */

        .lavender {
            border-color: #ce93d8;
        }

        .ocean {
            border-color: #81d4fa;
        }

        .mint {
            border-color: #81c784;
        }

        .rose {
            border-color: #ef9a9a;
        }

        .midnight {
            border-color: #616161;
        }

        hr {
            border: 0;
            border-top: 2px solid #a5d6a7;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <h1>🌱 THEME 🌱</h1>
    <h2>Modes</h2>
    <div class="theme-box">
        <button id="theme" class="theme-button">
            Dark Mode 🌙
        </button>
        <button class="theme-button">
            Light Mode ☀︎
        </button>
    </div>
    <hr>
    <h2>Colours</h2>
    <div class="theme-box">
        <button class="theme-button lavender">
            Lavender 💜
        </button>
        <button class="theme-button ocean">
            Ocean 🩵
        </button>
        <button class="theme-button mint">
            Mint 💚
        </button>
        <button class="theme-button rose">
            Rose ❤️
        </button>
        <button class="theme-button midnight">
            Midnight 🖤
        </button>
    </div>
</body>
</html>
